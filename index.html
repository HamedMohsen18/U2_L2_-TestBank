   const level=type==="mcq"?x[3]:(type==="tf"?x[2]:(type==="complete"?x[2]:(type==="terms"?x[2]:x[2])));
   const okl=state.filter==="all"||level===state.filter; return okq&&okl;
 }).map(({x,i})=>cardHTML(type,x,i)).join("");
 box.innerHTML=out||`<div class="empty">لا توجد نتائج مطابقة.</div>`;
}
function renderAll(){["essay","mcq","tf","complete","terms","why"].forEach(render); document.getElementById("count").textContent=Object.values(DATA).reduce((s,a)=>s+a.length,0)}
function toggleAns(b){b.nextElementSibling.classList.toggle("show");b.textContent=b.nextElementSibling.classList.contains("show")?"إخفاء الإجابة":"إظهار الإجابة"}
function mcq(btn,chosen,correct,i){const card=btn.closest(".card"); const opts=card.querySelectorAll(".opt"); opts.forEach((o,j)=>o.disabled=true); opts[correct].classList.add("correct"); const fb=card.querySelector(".feedback"); if(chosen===correct){state.score++;fb.textContent="✓ إجابة صحيحة";fb.style.color="var(--good)"}else{btn.classList.add("wrong");fb.textContent="✕ إجابة غير صحيحة";fb.style.color="var(--bad)"} state.answered++;updateScore()}
function tf(btn,chosen,correct,i){const card=btn.closest(".card");const opts=card.querySelectorAll(".opt");opts.forEach(o=>o.disabled=true);const good=chosen===correct;if(good)btn.classList.add("correct");else{btn.classList.add("wrong");opts[correct?0:1].classList.add("correct")}const fb=card.querySelector(".feedback");fb.textContent=good?"✓ إجابة صحيحة":"✕ إجابة غير صحيحة";fb.style.color=good?"var(--good)":"var(--bad)";state.score+=good?1:0;state.answered++;updateScore()}
function updateScore(){document.getElementById("score").textContent=`${state.score} / ${state.answered}`}
function tab(type,el){document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));el.classList.add("active");document.querySelectorAll(".section").forEach(x=>x.classList.remove("active"));document.getElementById("sec-"+type).classList.add("active")}
document.getElementById("search").addEventListener("input",e=>{state.query=e.target.value;renderAll()});
document.getElementById("filter").addEventListener("change",e=>{state.filter=e.target.value;renderAll()});
renderAll();
</script>
</body></html>
